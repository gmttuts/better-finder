<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Finder — the Finder, made for media</title>
  <meta name="description" content="Better Finder replaces Finder for people who work with video, motion and 3D on Mac (Windows 11 and Linux on the way): hover-scrub, a real player, transcripts, AI review, folder backgrounds.">
  <meta property="og:title" content="Better Finder">
  <meta property="og:description" content="The Finder, made for media.">
  <meta property="og:image" content="assets/icon.png">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top"><img src="assets/icon.png" alt="" width="28" height="28">Better Finder</a>
    <nav class="links">
      <a href="#views" data-i18n="nav.views"></a>
      <a href="#ai" data-i18n="nav.ai"></a>
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#" data-releases-open data-i18n="nav.new"></a>
      <a href="#support" data-i18n="nav.support"></a>
      <a href="#install" data-i18n="nav.install"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="vi">VI</button>
    </div>
    <a class="btn btn-small" href="#install" data-i18n="nav.download"></a>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="glow" aria-hidden="true"></div>
      <img class="hero-icon reveal" src="assets/icon.png" alt="Better Finder icon" width="132" height="132">
      <span class="badge reveal"><span data-i18n="hero.badge"></span> · <span data-version></span></span>
      <h1 class="reveal" data-i18n="hero.title"></h1>
      <p class="lead reveal" data-i18n="hero.sub"></p>
      <div class="cta-row reveal">
        <a class="btn" data-download><span data-i18n="hero.download"></span></a>
        <a class="btn btn-ghost" href="#features" data-i18n="hero.more"></a>
      </div>
      <p class="fine reveal" data-requires></p>
      <p class="fine reveal"><span class="soon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.3l5.7-.8v5.5H1zM7.5 1.4L15 .3V7H7.5zM1 8h5.7v5.5L1 12.7zM7.5 8H15v6.7l-7.5-1z"/></svg><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c-1.7 0-2.6 1.4-2.6 3.3 0 1-.5 1.6-1.2 2.5C3.3 8 2.6 9.3 2.6 10.6c0 .5.1 1 .3 1.3-.6.3-1 .8-1 1.3 0 .9 1.2 1.3 2.5 1.6.8.2 1.4.6 2 .9.5.2 1 .3 1.6.3s1.1-.1 1.6-.3c.6-.3 1.2-.7 2-.9 1.3-.3 2.5-.7 2.5-1.6 0-.5-.4-1-1-1.3.2-.3.3-.8.3-1.3 0-1.3-.7-2.6-1.6-3.8-.7-.9-1.2-1.5-1.2-2.5C10.6 2.4 9.7 1 8 1z"/></svg><span data-i18n="req.soon"></span></span></p>
      <div class="mbp mbp-dark reveal" data-macbook></div>
      <div class="views-head">
        <p class="kicker" data-i18n="views.kicker"></p>
        <h2 data-i18n="views.title"></h2>
      </div>
      <div id="views" class="hero-shot">
        <div class="vd vd-dark" data-views-demo></div>
        <div class="view-tabs" role="tablist">
          <button role="tab" data-view="list"><kbd>⌘1</kbd><span data-i18n="views.list"></span></button>
          <button role="tab" data-view="grid"><kbd>⌘2</kbd><span data-i18n="views.grid"></span></button>
          <button role="tab" data-view="columns"><kbd>⌘3</kbd><span data-i18n="views.columns"></span></button>
          <button role="tab" data-view="gallery"><kbd>⌘4</kbd><span data-i18n="views.gallery"></span></button>
          <button role="tab" data-view="globe"><kbd>⌘5</kbd><span data-i18n="views.globe"></span></button>
        </div>
        <p class="view-desc" data-view-desc></p>
      </div>
      <dl class="stats">
        <div><dt>5</dt><dd data-i18n="stats.views"></dd></div>
        <div><dt>20+</dt><dd data-i18n="stats.formats"></dd></div>
        <div><dt>3</dt><dd data-i18n="stats.engines"></dd></div>
        <div><dt data-i18n="stats.freeN"></dt><dd data-i18n="stats.free"></dd></div>
      </dl>
    </section>

    <!-- Made with AI? (the AI column, Get Info, Check on SynthID) -->
    <section id="ai" class="section ai-sec">
      <p class="kicker ai-kicker"><span class="ai-badge" data-ai-badge></span><span data-i18n="ai.kicker"></span></p>
      <h2 data-i18n="ai.title"></h2>
      <p class="lead" data-i18n="ai.sub"></p>
      <p class="fine ai-avail" data-ai-avail></p>
      <div class="ai-panel reveal">
        <div class="vd vd-dark fd" data-ai-demo></div>
        <p class="ai-honest" data-i18n="ai.honest"></p>
      </div>
        <div class="mp-points ai-points">
          <div><h3>ⓘ <span data-i18n="ai.p1.t"></span></h3><p data-i18n="ai.p1.d"></p></div>
          <div><h3>◎ <span data-i18n="ai.p2.t"></span></h3><p data-i18n="ai.p2.d"></p></div>
          <div><h3>⌂ <span data-i18n="ai.p3.t"></span></h3><p data-i18n="ai.p3.d"></p></div>
        </div>
        <div class="ai-how">
          <h3 data-i18n="ai.how.t"></h3>
          <ol data-ai-how></ol>
        </div>
    </section>

    <!-- Hover demo with real files -->
    <section id="demo" class="section">
      <p class="kicker" data-i18n="demo.kicker"></p>
      <h2 data-i18n="demo.title"></h2>
      <p class="lead" data-i18n="demo.sub"></p>
      <div class="demo-grid" data-demo></div>
      <div class="formats"><h3 data-i18n="demo.formats.t"></h3><p data-i18n="demo.formats"></p></div>
    </section>

    <!-- Features -->
    <section id="features" class="section">
      <p class="kicker" data-i18n="feat.kicker"></p>
      <h2 data-i18n="feat.title"></h2>
      <div class="features" data-features></div>
    </section>

    <!-- Media player -->
    <section id="player" class="section">
      <p class="kicker" data-i18n="mp.kicker"></p>
      <h2 class="wide" data-i18n="mp.title"></h2>
      <p class="lead" data-i18n="mp.sub"></p>
      <div class="vd vd-dark fd mp-win" data-media-demo></div>
      <div class="mp-points">
        <div><h3>▶︎ <span data-i18n="mp.p1.t"></span></h3><p data-i18n="mp.p1.d"></p></div>
        <div><h3>✂︎ <span data-i18n="mp.p2.t"></span></h3><p data-i18n="mp.p2.d"></p></div>
        <div><h3>⇣ <span data-i18n="mp.p3.t"></span></h3><p data-i18n="mp.p3.d"></p></div>
      </div>
    </section>

    <!-- Spotlights -->
    <section class="section spotlights">
      <article class="spot reveal">
        <div class="spot-text">
          <p class="kicker" data-i18n="spot.player.k"></p>
          <h3 data-i18n="spot.player.t"></h3>
          <p data-i18n="spot.player.d"></p>
        </div>
        <div class="vd vd-dark fd" data-player-demo></div>
      </article>
      <article class="spot flip reveal">
        <div class="spot-text">
          <p class="kicker" data-i18n="spot.sort.k"></p>
          <h3 data-i18n="spot.sort.t"></h3>
          <p data-i18n="spot.sort.d"></p>
        </div>
        <div class="vd vd-dark fd" data-sort-demo></div>
      </article>
      <article class="spot reveal">
        <div class="spot-text">
          <p class="kicker" data-i18n="spot.bg.k"></p>
          <h3 data-i18n="spot.bg.t"></h3>
          <p data-i18n="spot.bg.d"></p>
        </div>
        <div class="vd vd-dark fd" data-bg-demo></div>
      </article>
      <article class="spot flip reveal">
        <div class="spot-text">
          <p class="kicker" data-i18n="spot.search.k"></p>
          <h3 data-i18n="spot.search.t"></h3>
          <p data-i18n="spot.search.d"></p>
        </div>
        <div class="vd vd-dark fd" data-search-demo></div>
      </article>
    </section>

    <!-- Windows & Linux -->
    <section id="windows" class="section">
      <p class="kicker" data-i18n="win.kicker"></p>
      <h2 data-i18n="win.title"></h2>
      <p class="lead" data-win-sub></p>
      <div class="win-grid" data-win-groups></div>
      <a class="btn btn-ghost win-get" href="#download" data-win-get data-i18n="win.get"></a>
    </section>

    <!-- Compare -->
    <section id="compare" class="section narrow">
      <p class="kicker" data-i18n="cmp.kicker"></p>
      <h2 data-i18n="cmp.title"></h2>
      <table class="compare">
        <thead><tr><th></th><th class="bf"><img src="assets/icon.png" alt="" width="28" height="28">Better Finder</th><th>Finder</th></tr></thead>
        <tbody data-compare></tbody>
      </table>
    </section>

    <!-- Install -->
    <section id="install" class="section narrow">
      <p class="kicker" data-i18n="install.kicker"></p>
      <h2 data-i18n="install.title"></h2>
      <div class="download-card">
        <img src="assets/icon.png" alt="" width="64" height="64">
        <div>
          <strong>Better Finder <span data-version></span></strong>
          <span class="fine" data-requires></span>
          <span class="fine"><span class="soon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.3l5.7-.8v5.5H1zM7.5 1.4L15 .3V7H7.5zM1 8h5.7v5.5L1 12.7zM7.5 8H15v6.7l-7.5-1z"/></svg><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c-1.7 0-2.6 1.4-2.6 3.3 0 1-.5 1.6-1.2 2.5C3.3 8 2.6 9.3 2.6 10.6c0 .5.1 1 .3 1.3-.6.3-1 .8-1 1.3 0 .9 1.2 1.3 2.5 1.6.8.2 1.4.6 2 .9.5.2 1 .3 1.6.3s1.1-.1 1.6-.3c.6-.3 1.2-.7 2-.9 1.3-.3 2.5-.7 2.5-1.6 0-.5-.4-1-1-1.3.2-.3.3-.8.3-1.3 0-1.3-.7-2.6-1.6-3.8-.7-.9-1.2-1.5-1.2-2.5C10.6 2.4 9.7 1 8 1z"/></svg><span data-i18n="req.soon"></span></span></span>
        </div>
        <a class="btn" data-download><span data-i18n="hero.download"></span></a>
      </div>
      <ol class="steps">
        <li><h3 data-i18n="install.1.t"></h3><p data-i18n="install.1.d"></p></li>
        <li>
          <h3 data-i18n="install.2.t"></h3><p data-i18n="install.2.d"></p>
          <p class="fine" data-i18n="install.2.x"></p>
          <div class="code"><code>xattr -dr com.apple.quarantine "/Applications/Better Finder.app"</code><button data-copy data-i18n="install.copy"></button></div>
        </li>
        <li>
          <h3 data-i18n="install.3.t"></h3><p data-i18n="install.3.d"></p>
          <div class="code"><code>brew install ffmpeg</code><button data-copy data-i18n="install.copy"></button></div>
          <div class="code"><code>brew install whisper-cpp</code><button data-copy data-i18n="install.copy"></button></div>
        </li>
      </ol>
      <p class="warn">⚠️ <span data-i18n="install.warn"></span></p>
    </section>

    <!-- Support the author -->
    <section id="support" class="section narrow support">
      <p class="kicker" data-i18n="support.kicker"></p>
      <h2 data-i18n="support.title"></h2>

        <button class="btn btn-coffee" data-support="bmc">☕ <span data-i18n="support.bmc"></span></button>
        <button class="btn btn-momo" data-support="momo"><span class="momo-dot">M</span><span data-i18n="support.momo"></span></button>
      </div>

      <h2 data-i18n="faq.title"></h2>

        <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>

        <details><summary data-i18n="faq.8.q"></summary><p data-i18n="faq.8.a"></p></details>
        <details><summary data-i18n="faq.9.q"></summary><p data-i18n="faq.9.a"></p></details>
        <details><summary data-i18n="faq.10.q"></summary><p data-i18n="faq.10.a"></p></details>

    <section class="section final">
      <img src="assets/icon.png" alt="" width="96" height="96">
      <h2 data-i18n="cta.title"></h2>
      <a class="btn" data-download><span data-i18n="hero.download"></span></a>
      <p class="fine" data-requires></p>
      <p class="fine"><span class="soon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.3l5.7-.8v5.5H1zM7.5 1.4L15 .3V7H7.5zM1 8h5.7v5.5L1 12.7zM7.5 8H15v6.7l-7.5-1z"/></svg><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c-1.7 0-2.6 1.4-2.6 3.3 0 1-.5 1.6-1.2 2.5C3.3 8 2.6 9.3 2.6 10.6c0 .5.1 1 .3 1.3-.6.3-1 .8-1 1.3 0 .9 1.2 1.3 2.5 1.6.8.2 1.4.6 2 .9.5.2 1 .3 1.6.3s1.1-.1 1.6-.3c.6-.3 1.2-.7 2-.9 1.3-.3 2.5-.7 2.5-1.6 0-.5-.4-1-1-1.3.2-.3.3-.8.3-1.3 0-1.3-.7-2.6-1.6-3.8-.7-.9-1.2-1.5-1.2-2.5C10.6 2.4 9.7 1 8 1z"/></svg><span data-i18n="req.soon"></span></span></p>

  </main>

  <footer class="footer">
    <span>© <span data-year></span> Better Finder</span>
    <a href="#" data-releases-open><span data-i18n="nav.new"></span> · <span data-version></span></a>
    <span data-i18n="footer.made"></span>
  </footer>

  <dialog class="support-modal" data-support-modal>
    <button class="x" data-close aria-label="Close">×</button>

    <div class="qr-row" data-support-qr></div>
    <p class="fine" data-i18n="support.thanks"></p>
  </dialog>

  <dialog class="rel-modal" data-releases-modal>
    <header><div><h3 data-i18n="new.title"></h3><p class="fine"><span data-i18n="new.sub"></span> <span data-i18n="new.note"></span></p></div>
      <button class="x" data-close aria-label="Close">×</button></header>
    <ol class="releases" data-releases></ol>
  </dialog>

  <script src="content.js"></script>
  <script src="data/changelog.js"></script>
  <script src="main.js"></script>
  <script src="views-demo.js"></script>

</body>
</html>
