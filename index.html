<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Finder — the Finder, made for media</title>
  <meta name="description" content="Better Finder replaces Finder for people who work with video, motion and 3D on Mac (Windows 11 and Linux on the way): hover-scrub, Lottie and Rive previews, a real player, transcripts, folder backgrounds. Free.">
  <meta property="og:title" content="Better Finder">
  <meta property="og:description" content="The Finder, made for media.">
  <meta property="og:image" content="assets/icon.png">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles-b.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top"><img src="assets/icon.png" alt="" width="26" height="26">Better Finder</a>
    <nav class="links">
      <a href="#ai" data-i18n="nav.ai"></a>
      <a href="#demo" data-i18n="demo.kicker"></a>
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#" data-releases-open data-i18n="nav.new"></a>
      <a href="#support" data-i18n="nav.support"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="vi">VI</button></div>
    <a class="btn btn-small" href="#install" data-i18n="nav.download"></a>
  </header>

  <main id="top">
    <!-- Hero: one strong line in the middle, then a MacBook with the app running -->
    <section class="hero-b wrap">
      <div class="hero-sky">
        <a class="pill" href="#" data-releases-open><span class="pill-new" data-i18n="hero.new"></span><span data-i18n="hero.pill"></span> <span data-version></span> <span aria-hidden="true">→</span></a>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.sub"></p>
        <div class="cta-row">
          <a class="btn" data-download><svg class="apple" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.2-.9-1.7 0-3.2 1-4.1 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3.1 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.7zM14 5.2c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg><span data-i18n="hero.download"></span></a>
          <button class="btn btn-soft" data-support="both">☕ <span data-i18n="nav.support"></span></button>
        </div>
        <p class="fine"><span data-requires></span></p>
        <p class="fine"><span class="soon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.3l5.7-.8v5.5H1zM7.5 1.4L15 .3V7H7.5zM1 8h5.7v5.5L1 12.7zM7.5 8H15v6.7l-7.5-1z"/></svg><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c-1.7 0-2.6 1.4-2.6 3.3 0 1-.5 1.6-1.2 2.5C3.3 8 2.6 9.3 2.6 10.6c0 .5.1 1 .3 1.3-.6.3-1 .8-1 1.3 0 .9 1.2 1.3 2.5 1.6.8.2 1.4.6 2 .9.5.2 1 .3 1.6.3s1.1-.1 1.6-.3c.6-.3 1.2-.7 2-.9 1.3-.3 2.5-.7 2.5-1.6 0-.5-.4-1-1-1.3.2-.3.3-.8.3-1.3 0-1.3-.7-2.6-1.6-3.8-.7-.9-1.2-1.5-1.2-2.5C10.6 2.4 9.7 1 8 1z"/></svg><span data-i18n="req.soon"></span></span></p>
        <div class="mbp" data-macbook></div>
      </div>
    </section>

    <!-- Five views (restored) -->
    <div class="wrap views-head">
      <h2><span data-i18n="views.kicker"></span>. <span class="soft" data-i18n="views.title"></span></h2>
    </div>
    <div id="views" class="stage-panel wrap hero-panel">
      <div class="vd" data-views-demo></div>
      <div class="view-strip" role="tablist">
        <button role="tab" data-view="list"><b data-i18n="views.list"></b><kbd>⌘1</kbd></button>
        <button role="tab" data-view="grid"><b data-i18n="views.grid"></b><kbd>⌘2</kbd></button>
        <button role="tab" data-view="columns"><b data-i18n="views.columns"></b><kbd>⌘3</kbd></button>
        <button role="tab" data-view="gallery"><b data-i18n="views.gallery"></b><kbd>⌘4</kbd></button>
        <button role="tab" data-view="globe"><b data-i18n="views.globe"></b><kbd>⌘5</kbd></button>
      </div>
      <p class="view-desc" data-view-desc></p>
    </div>

    <section class="wrap">
      <dl class="stats">
        <div><dt>5</dt><dd data-i18n="stats.views"></dd></div>
        <div><dt>20+</dt><dd data-i18n="stats.formats"></dd></div>
        <div><dt>3</dt><dd data-i18n="stats.engines"></dd></div>
        <div><dt data-i18n="stats.freeN"></dt><dd data-i18n="stats.free"></dd></div>
      </dl>
    </section>

    <!-- Made with AI? (the AI column, Get Info, Check on SynthID) -->
    <section id="ai" class="block wrap ai-sec">
      <p class="ai-kicker"><span class="ai-badge" data-ai-badge></span><span data-i18n="ai.kicker"></span></p>
      <h2><span data-i18n="ai.title"></span> <span class="soft" data-i18n="ai.sub"></span></h2>
      <p class="fine ai-avail" data-ai-avail></p>
      <div class="stage-panel ai-panel reveal">
        <div class="vd fd" data-ai-demo></div>
        <p class="ai-honest" data-i18n="ai.honest"></p>
      </div>
        <div class="mp-points ai-points">
          <div><h3>ⓘ <span data-i18n="ai.p1.t"></span></h3><p data-i18n="ai.p1.d"></p></div>
          <div><h3>◎ <span data-i18n="ai.p2.t"></span></h3><p data-i18n="ai.p2.d"></p></div>
          <div><h3>⌂ <span data-i18n="ai.p3.t"></span></h3><p data-i18n="ai.p3.d"></p></div>
        </div>
        <div class="ai-how">
          <h3 data-i18n="ai.how.t"></h3>
          <ol data-ai-how></ol>
        </div>
    </section>

    <!-- Hover demo -->
    <section id="demo" class="block wrap">
      <h2><span data-i18n="demo.title"></span> <span class="soft" data-i18n="demo.sub"></span></h2>
      <div class="demo-grid" data-demo></div>
      <div class="formats"><h3 data-i18n="demo.formats.t"></h3><p data-i18n="demo.formats"></p></div>
    </section>

    <!-- Media player -->
    <section id="player" class="block wrap">
      <h2><span data-i18n="mp.title"></span> <span class="soft" data-i18n="mp.sub"></span></h2>
      <div class="stage-panel reveal"><div class="vd fd" data-media-demo></div></div>
      <div class="mp-points">
        <div><h3>▶︎ <span data-i18n="mp.p1.t"></span></h3><p data-i18n="mp.p1.d"></p></div>
        <div><h3>✂︎ <span data-i18n="mp.p2.t"></span></h3><p data-i18n="mp.p2.d"></p></div>
        <div><h3>⇣ <span data-i18n="mp.p3.t"></span></h3><p data-i18n="mp.p3.d"></p></div>
      </div>
    </section>

    <!-- Spotlights -->
    <section class="block wrap spots">
      <article class="spot reveal">
        <h3><span data-i18n="spot.player.t"></span> <span class="soft" data-i18n="spot.player.d"></span></h3>
        <div class="stage-panel"><div class="vd fd" data-player-demo></div></div>
      </article>
      <article class="spot reveal">
        <h3><span data-i18n="spot.sort.t"></span> <span class="soft" data-i18n="spot.sort.d"></span></h3>
        <div class="stage-panel"><div class="vd fd" data-sort-demo></div></div>
      </article>
      <div class="spot-pair">
        <article class="spot reveal">
          <h3><span data-i18n="spot.bg.t"></span> <span class="soft" data-i18n="spot.bg.d"></span></h3>
          <div class="stage-panel"><div class="vd fd" data-bg-demo></div></div>
        </article>
        <article class="spot reveal">
          <h3><span data-i18n="spot.search.t"></span> <span class="soft" data-i18n="spot.search.d"></span></h3>
          <div class="stage-panel"><div class="vd fd" data-search-demo></div></div>
        </article>
      </div>
    </section>

    <!-- Features -->
    <section id="features" class="block wrap">
      <h2><span data-i18n="feat.kicker"></span>. <span class="soft" data-i18n="feat.title"></span></h2>
      <div class="features" data-features></div>
    </section>

    <!-- Windows & Linux -->
    <section id="windows" class="block wrap">
      <h2><span data-i18n="win.title"></span> <span class="soft" data-win-sub></span></h2>
      <div class="win-grid" data-win-groups></div>
      <a class="btn btn-soft win-get" href="#download" data-win-get data-i18n="win.get"></a>
    </section>

    <!-- Compare -->
    <section id="compare" class="block wrap narrow">
      <h2 data-i18n="cmp.title"></h2>
      <table class="compare">
        <thead><tr><th></th><th class="bf"><img src="assets/icon.png" alt="" width="24" height="24">Better Finder</th><th>Finder</th></tr></thead>
        <tbody data-compare></tbody>
      </table>
    </section>

    <!-- Support -->
    <section id="support" class="block wrap">
      <div class="support-card">
        <div class="support-text">
          <h2 data-i18n="support.title"></h2>
          <p data-i18n="support.sub"></p>
          <div class="cta-row">
            <button class="btn btn-coffee" data-support="bmc">☕ <span data-i18n="support.bmc"></span></button>
            <button class="btn btn-momo" data-support="momo"><span class="momo-dot">M</span><span data-i18n="support.momo"></span></button>
          </div>
        </div>
        <!-- a friendly coffee cup, drawn in SVG -->
        <svg class="cup" viewBox="0 0 320 280" aria-hidden="true">
          <ellipse cx="150" cy="248" rx="112" ry="16" fill="#f1dcc0"/>
          <g class="cup-spark" stroke="#ffcc00" stroke-width="7" stroke-linecap="round">
            <line x1="30" y1="62" x2="44" y2="84"/><line x1="16" y1="112" x2="40" y2="118"/>
            <line x1="292" y1="58" x2="276" y2="82"/><line x1="306" y1="108" x2="282" y2="116"/>
          </g>
          <g class="cup-steam" fill="none" stroke="#2b2420" stroke-width="5" stroke-linecap="round">
            <path d="M120 82c-10-12 10-22 0-36"/><path d="M152 70c-12-14 12-26 0-44"/><path d="M184 82c-10-12 10-22 0-36"/>
          </g>
          <path d="M248 138c34-6 46 34 14 54-10 6-24 8-36 6" fill="none" stroke="#2b2420" stroke-width="8" stroke-linecap="round"/>
          <path d="M54 118h196c0 70-26 120-98 120S54 188 54 118z" fill="#fffaf2" stroke="#2b2420" stroke-width="8" stroke-linejoin="round"/>
          <ellipse cx="152" cy="118" rx="98" ry="20" fill="#5a3a24" stroke="#2b2420" stroke-width="8"/>
          <ellipse cx="128" cy="113" rx="34" ry="6" fill="#7b5235"/>
          <g class="cup-face">
            <circle cx="122" cy="172" r="7" fill="#2b2420"/><circle cx="182" cy="172" r="7" fill="#2b2420"/>
            <path d="M136 192q16 14 32 0" fill="none" stroke="#2b2420" stroke-width="6" stroke-linecap="round"/>
            <circle cx="104" cy="190" r="9" fill="#ffb4a2" opacity=".7"/><circle cx="200" cy="190" r="9" fill="#ffb4a2" opacity=".7"/>
          </g>
        </svg>
      </div>
    </section>

    <!-- Install -->
    <section id="install" class="block wrap narrow">
      <h2><span data-i18n="install.kicker"></span>. <span class="soft" data-i18n="install.title"></span></h2>
      <div class="download-card">
        <img src="assets/icon.png" alt="" width="56" height="56">
        <div><strong>Better Finder <span data-version></span></strong><span class="fine" data-requires></span><span class="fine"><span class="soon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.3l5.7-.8v5.5H1zM7.5 1.4L15 .3V7H7.5zM1 8h5.7v5.5L1 12.7zM7.5 8H15v6.7l-7.5-1z"/></svg><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c-1.7 0-2.6 1.4-2.6 3.3 0 1-.5 1.6-1.2 2.5C3.3 8 2.6 9.3 2.6 10.6c0 .5.1 1 .3 1.3-.6.3-1 .8-1 1.3 0 .9 1.2 1.3 2.5 1.6.8.2 1.4.6 2 .9.5.2 1 .3 1.6.3s1.1-.1 1.6-.3c.6-.3 1.2-.7 2-.9 1.3-.3 2.5-.7 2.5-1.6 0-.5-.4-1-1-1.3.2-.3.3-.8.3-1.3 0-1.3-.7-2.6-1.6-3.8-.7-.9-1.2-1.5-1.2-2.5C10.6 2.4 9.7 1 8 1z"/></svg><span data-i18n="req.soon"></span></span></span></div>
        <a class="btn" data-download><span data-i18n="hero.download"></span></a>
      </div>
      <ol class="steps">
        <li><h3 data-i18n="install.1.t"></h3><p data-i18n="install.1.d"></p></li>
        <li>
          <h3 data-i18n="install.2.t"></h3><p data-i18n="install.2.d"></p>
          <p class="fine" data-i18n="install.2.x"></p>
          <div class="code"><code>xattr -dr com.apple.quarantine "/Applications/Better Finder.app"</code><button data-copy data-i18n="install.copy"></button></div>
        </li>
        <li>
          <h3 data-i18n="install.3.t"></h3><p data-i18n="install.3.d"></p>
          <div class="code"><code>brew install ffmpeg</code><button data-copy data-i18n="install.copy"></button></div>
          <div class="code"><code>brew install whisper-cpp</code><button data-copy data-i18n="install.copy"></button></div>
        </li>
      </ol>
      <p class="warn">⚠️ <span data-i18n="install.warn"></span></p>
    </section>

    <!-- FAQ -->
    <section class="block wrap narrow">
      <h2 data-i18n="faq.title"></h2>
      <div class="faq">
        <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
        <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
        <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
        <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
        <details><summary data-i18n="faq.6.q"></summary><p data-i18n="faq.6.a"></p></details>
        <details><summary data-i18n="faq.7.q"></summary><p data-i18n="faq.7.a"></p></details>
        <details><summary data-i18n="faq.8.q"></summary><p data-i18n="faq.8.a"></p></details>
        <details><summary data-i18n="faq.9.q"></summary><p data-i18n="faq.9.a"></p></details>
        <details><summary data-i18n="faq.10.q"></summary><p data-i18n="faq.10.a"></p></details>
        <details><summary data-i18n="faq.5.q"></summary><p data-i18n="faq.5.a"></p></details>
      </div>
    </section>
  </main>

  <footer class="footer wrap">
    <div class="foot-brand"><img src="assets/icon.png" alt="" width="40" height="40"><span data-i18n="footer.made"></span></div>
    <nav>
      <a href="#install" data-i18n="nav.download"></a>
      <a href="#" data-releases-open data-i18n="nav.new"></a>
      <a href="#support" data-i18n="nav.support"></a>
    </nav>
    <span class="fine">© <span data-year></span> Better Finder</span>
  </footer>

  <dialog class="support-modal" data-support-modal>
    <button class="x" data-close aria-label="Close">×</button>
    <h3 data-support-title></h3>
    <p class="fine" data-i18n="support.scan"></p>
    <div class="qr-row" data-support-qr></div>
    <p class="fine" data-i18n="support.thanks"></p>
  </dialog>

  <dialog class="rel-modal" data-releases-modal>
    <header><div><h3 data-i18n="new.title"></h3><p class="fine"><span data-i18n="new.sub"></span> <span data-i18n="new.note"></span></p></div>
      <button class="x" data-close aria-label="Close">×</button></header>
    <ol class="releases" data-releases></ol>
  </dialog>

  <script src="content.js"></script>
  <script src="data/changelog.js"></script>
  <script src="main.js"></script>
  <script src="views-demo.js"></script>

</body>
</html>
